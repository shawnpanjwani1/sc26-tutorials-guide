<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC'26 Team Learning Plan</title>
<style>
:root{color-scheme:light dark;
 --bg:#f3f5fa;--card:#fff;--card2:#f7f8fc;--ink:#141b2d;--mute:#586279;--line:#dde2ec;--line2:#ebeef5;
 --acc:#2757e6;--acc-ink:#1e46c4;--acc2:#e8eeff;--btn:#2757e6;--btn-h:#1e46c4;--ring:rgba(39,87,230,.22);
 --ok:#1c7437;--okbg:#e2f4e7;--warn:#a65300;
 --navy:#0a1330;--glow:#5fd8ff;
 --sh:0 1px 2px rgba(16,24,48,.05);--sh2:0 10px 28px rgba(16,24,48,.12);
 --h:222;--s:72%;--cbg:94%;--cfg:31%;--dot:50%}
@media (prefers-color-scheme:dark){:root{
 --bg:#0a0e19;--card:#131929;--card2:#182036;--ink:#e7ebf5;--mute:#9ba6bc;--line:#262f48;--line2:#1d2539;
 --acc:#8eaaff;--acc-ink:#b3c5ff;--acc2:#1b2750;--btn:#3a63ee;--btn-h:#5078f5;--ring:rgba(142,170,255,.28);
 --ok:#63d48d;--okbg:#143222;--warn:#f2a655;
 --navy:#070c1d;
 --sh:0 1px 2px rgba(0,0,0,.3);--sh2:0 10px 28px rgba(0,0,0,.45);
 --cbg:19%;--cfg:83%;--dot:62%}}
.ph-P0{--h:222;--s:14%}.ph-P1{--h:214}.ph-P2{--h:262}.ph-P3{--h:156}.ph-P4{--h:22}.ph-P5{--h:190}.ph-P6{--h:334}.ph-P7{--h:42}.ph-P8{--h:292}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
a{color:var(--acc-ink);text-underline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}

/* header + nav */
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(255,255,255,.1)}
header :focus-visible{outline-color:var(--glow)}
.top{display:flex;align-items:center;gap:16px;padding:10px 0 2px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;color:#fff;text-decoration:none}
.brand h1{font-size:15.5px;font-weight:650;margin:0;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:24px;height:24px;border-radius:7px;flex:none;background:radial-gradient(circle,rgba(255,255,255,.95) 1.2px,transparent 1.7px) 0 0/8px 8px,linear-gradient(135deg,#3d6bff,#5fd8ff)}
.hprog{display:flex;align-items:center;gap:10px;flex:none;font-size:12.5px;color:#b7c2de;font-variant-numeric:tabular-nums}
.bar{height:6px;width:140px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ade80,#5fd8ff);border-radius:99px;transition:width .3s}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -10px}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;color:#aab6d4;padding:9px 12px 11px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;position:relative;border-radius:7px 7px 0 0;transition:color .15s,background .15s}
nav button:hover{color:#fff;background:rgba(255,255,255,.07)}
nav button.on{color:#fff;font-weight:600}
nav button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--glow)}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:44px 0 76px;background:radial-gradient(820px 360px at 88% -8%,rgba(95,216,255,.24),transparent 62%),radial-gradient(700px 420px at -4% 112%,rgba(78,104,255,.34),transparent 62%),var(--navy)}
.hero::before,.hero::after{content:"";position:absolute;inset:0;pointer-events:none;-webkit-mask-image:linear-gradient(100deg,rgba(0,0,0,.2) 20%,#000 75%);mask-image:linear-gradient(100deg,rgba(0,0,0,.2) 20%,#000 75%)}
.hero::before{background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:32px 32px}
.hero::after{opacity:.85;background-image:radial-gradient(circle at 3px 3px,rgba(95,216,255,.95) 2.4px,transparent 3px),conic-gradient(at 56px 1px,transparent 270deg,rgba(95,216,255,.6) 270deg),conic-gradient(at 1px 40px,transparent 270deg,rgba(95,216,255,.6) 270deg);background-size:160px 128px;background-position:-3px -3px,0 0,64px 64px}
.hero .wrap{position:relative;z-index:1}
.eyebrow{font:600 12px/1.2 ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--glow)}
.herot{font-size:clamp(29px,4.6vw,46px);line-height:1.08;letter-spacing:-.022em;font-weight:750;margin:14px 0 12px;color:#fff}
.herot span{color:#9fb4ff;font-weight:500;white-space:nowrap}
.lead{font-size:clamp(15.5px,1.7vw,18px);color:#c9d3ee;max-width:640px;margin:0}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:30px}
.hstat{padding:14px 16px 13px;border:1px solid rgba(255,255,255,.16);background:rgba(17,28,66,.82);border-radius:12px;position:relative;min-width:0}
.hstat::before{content:"";position:absolute;left:16px;top:-1px;width:28px;height:2px;background:var(--glow);border-radius:2px}
.hstat b{display:block;font-size:clamp(23px,3.1vw,34px);line-height:1.15;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.hstat span{font-size:13px;color:#b7c2de}

/* landing */
#main{padding:20px 20px 64px}
body[data-view=today] #main{padding-top:0}
body.to .hprog{display:none}
.hero.compact{padding:26px 0 30px}.hero.compact .herot{font-size:clamp(26px,3.6vw,36px);margin:10px 0 8px}.hero.compact .lead{max-width:760px;font-size:clamp(14.5px,1.5vw,16.5px)}.hero.compact .hstats{margin-top:20px}
.tofoot{margin:18px 2px 0;text-align:center}
.entry{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:14px;margin-top:-38px;position:relative;z-index:1}
.ecard{display:flex;gap:14px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;box-shadow:var(--sh2);min-width:0;transition:transform .16s,border-color .16s,box-shadow .16s}
.ecard:hover{transform:translateY(-2px);border-color:var(--acc)}
.ecard:focus-visible{outline-offset:3px;border-radius:14px}
.ecard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--acc2);color:var(--acc-ink);flex:none}
.ecard .tx{flex:1;min-width:0}
.ecard b{display:block;font-size:16.5px;line-height:1.25}
.ecard small{display:block;color:var(--mute);font-size:13px;margin-top:3px;line-height:1.35}
.ecard .ar{font-size:20px;line-height:1;color:var(--mute);transition:transform .16s}
.ecard:hover .ar{transform:translateX(4px)}
.ecard.pri{background:var(--btn);border-color:var(--btn);color:#fff}
.ecard.pri .ic{background:rgba(255,255,255,.18);color:#fff}
.ecard.pri small,.ecard.pri .ar{color:#dbe4ff}
.sec{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin:34px 0 12px}
.sec h2{font-size:18px;margin:0;letter-spacing:-.005em}
.topics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.topic{display:flex;flex-direction:column;justify-content:flex-start;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-top:3px solid hsl(var(--h) var(--s) var(--dot));border-radius:12px;padding:13px 14px 12px;cursor:pointer;min-width:0;box-shadow:var(--sh);transition:transform .16s,box-shadow .16s}
.topic:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.topic .tk{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.topic b{font-size:14.5px;line-height:1.3}
.topic .cnt{flex:none;font:600 12px/1 ui-monospace,Consolas,monospace;padding:4px 7px;border-radius:99px;background:hsl(var(--h) var(--s) var(--cbg));color:hsl(var(--h) var(--s) var(--cfg))}
.topic .td{display:block;color:var(--mute);font-size:13px;line-height:1.4;margin-top:6px}
.how3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.how{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--sh)}
.how b{display:block;margin-bottom:3px}
.notes{margin:12px 0 0;padding:2px 0 2px 12px;border-left:2px solid var(--line);color:var(--mute);font-size:12.5px;line-height:1.5}
.notes p{margin:0 0 4px}.notes p:last-child{margin:0}
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.pstat{padding:11px 16px;border-left:1px solid var(--line2);min-width:0}
.pstat:first-child{border-left:0}
.pstat b{display:block;font-size:19px;line-height:1.25;font-variant-numeric:tabular-nums}
.pstat span{color:var(--mute);font-size:12.5px}

/* shared pieces */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;min-width:0;overflow-wrap:anywhere;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.grid>.card{margin-bottom:0}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:0 0 4px}
.mute{color:var(--mute)}
.small{font-size:13px}
.label{font:600 11.5px/1.2 ui-monospace,Consolas,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--acc-ink)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:550;line-height:1.2;padding:3px 9px;border-radius:99px;background:var(--acc2);color:var(--acc-ink);margin-right:4px;max-width:100%;vertical-align:middle}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.lvl{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--mute);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.25;padding:3px 10px 3px 8px;border-radius:11px;background:hsl(var(--h) var(--s) var(--cbg));color:hsl(var(--h) var(--s) var(--cfg));max-width:100%}
.chip::before,.tchip::before{content:"";width:7px;height:7px;border-radius:50%;background:hsl(var(--h) var(--s) var(--dot));flex:none}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1.2;padding:3px 8px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);color:var(--mute);background:var(--card2);white-space:nowrap}
.badge.day::before{content:"";width:7px;height:7px;border-radius:2px;background:#f59e0b}
.badge.day.mon::before{background:#06b6d4}
.badge.len::before{content:"";width:14px;height:6px;border-radius:2px;box-shadow:inset 0 0 0 1px currentColor;background:currentColor}
.badge.len.half::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 13px;border-radius:8px;font:inherit;font-size:14px;font-weight:500;line-height:1.4;cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:#fff}
.btn.pri:hover{background:var(--btn-h);border-color:var(--btn-h)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:not([type=checkbox]):focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--ring)}
input[type=checkbox]{accent-color:var(--btn);padding:0}
textarea{width:100%;min-height:110px;background:var(--card2);display:block}
kbd{font:12px ui-monospace,monospace;background:var(--acc2);padding:1px 5px;border-radius:4px}

/* learning-path cards */
.tut{cursor:pointer;border-top:3px solid hsl(var(--h) var(--s) var(--dot));transition:border-color .15s,transform .16s,box-shadow .16s;display:flex;flex-direction:column}
.tut:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.tut:focus-visible{border-radius:12px}
.tut .num{font:600 12px/1 ui-monospace,Consolas,monospace;padding:4px 7px;border-radius:6px;background:hsl(var(--h) var(--s) var(--cbg));color:hsl(var(--h) var(--s) var(--cfg))}
.tut .tags{margin-top:auto;padding-top:10px;display:flex;flex-wrap:wrap;gap:5px}
.tut .tags .pill{margin:0}
.tut .p{height:4px;background:var(--line2);border-radius:3px;margin-top:10px;overflow:hidden}
.tut .p i{display:block;height:100%;background:var(--acc)}
.tut.done .p i{background:var(--ok)}
.phase{margin:30px 0 12px;display:flex;align-items:flex-start;gap:12px}
.phase:first-child{margin-top:4px}
.phase h2{margin:0 0 1px;font-size:18px}
.phase .pnum{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 15px/1 ui-monospace,Consolas,monospace;background:hsl(var(--h) var(--s) var(--cbg));color:hsl(var(--h) var(--s) var(--cfg))}
.phase .pt{flex:1;min-width:0}
.phase .pc{flex:none;white-space:nowrap;padding-top:4px}
.next{border-left:4px solid var(--acc)}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.flow span{font-size:12.5px;padding:3px 10px;border-radius:12px;background:var(--acc2);color:var(--acc-ink)}
.flow span.ok{background:var(--okbg);color:var(--ok)}

/* tutorials list */
.tchips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.tchip{font:inherit;font-size:13px;font-weight:550;line-height:1.2;display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
.tchip:hover{border-color:hsl(var(--h) var(--s) var(--dot))}
.tchip.all::before{display:none}
.tchip i{font-style:normal;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.tchip.on{background:hsl(var(--h) var(--s) var(--cbg));border-color:hsl(var(--h) var(--s) var(--dot));color:hsl(var(--h) var(--s) var(--cfg))}
.tchip.on i{color:inherit}
.tchip:focus-visible{border-radius:99px}
.tfil>*{min-width:0}
.tfil input[type=search]{flex:1 1 220px}
.tbar{display:flex;align-items:center;gap:10px;margin:12px 0 4px;min-height:28px}
.tbar .btn{padding:2px 10px;font-size:13px}
.trow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:14px 10px;margin:0 -10px;border-top:1px solid var(--line2);transition:background .15s}
.trow:hover{background:var(--card2)}
.tnum{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font:600 14px/1 ui-monospace,Consolas,monospace;background:hsl(var(--h) var(--s) var(--cbg));color:hsl(var(--h) var(--s) var(--cfg))}
.trow .tbtn{display:block;background:none;border:0;padding:0;margin:0;font:inherit;font-weight:650;font-size:15.5px;line-height:1.35;color:var(--ink);text-align:left;cursor:pointer;overflow-wrap:anywhere;max-width:100%}
.trow .tbtn:hover{color:var(--acc-ink);text-decoration:underline;text-underline-offset:3px}
.tsum{font-size:13.5px;color:var(--mute);margin-top:2px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.tpp{font-size:13px;margin-top:5px;overflow-wrap:anywhere}
.tpp::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50% 50% 3px 3px;background:var(--mute);opacity:.55;margin-right:7px}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tmeta .pill{margin:0}

/* tutorial modal */
#detail{position:fixed;inset:0;background:rgba(6,10,24,.62);display:none;z-index:10;overflow:auto}
#detail .panel{max-width:980px;margin:32px auto;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:0 24px 12px;overflow-wrap:anywhere;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .18s ease-out}
#detail .panel:focus{outline:none}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.dbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 -24px;padding:11px 24px;background:var(--bg);border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
.dbar h2{margin:0}
.dhead{padding:20px 0 18px}
.dhead h2{font-size:clamp(20px,2.6vw,25px);line-height:1.22;letter-spacing:-.012em;margin:0 0 10px}
.dmeta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 0;font-size:13.5px;color:var(--mute)}
.dmeta>span:not(.chip):not(.pill){white-space:nowrap}
.dmeta i{font-style:normal;margin:0 8px}
.dmeta .chip{margin-right:12px}.dmeta .pill{margin:0 0 0 12px}
.dsum{font-size:16px;line-height:1.5;margin:12px 0 0;max-width:760px}
.dact{margin-bottom:14px}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.cols>div{min-width:0}
#detail .card>h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:10px}
ul.check{list-style:none;padding:0;margin:0}
ul.check li{padding:7px 0;border-bottom:1px solid var(--line2);display:flex;gap:8px;align-items:flex-start}
ul.check li:last-child{border:0}
ul.check label{display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0;cursor:pointer}
ul.check input{margin-top:3px;width:17px;height:17px;flex:none}
ul.check li.d span{color:var(--mute);text-decoration:line-through}
.pres{display:flex;gap:10px;align-items:center;padding:6px 0}
.pres+.pres{border-top:1px solid var(--line2)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 11px/1 system-ui,sans-serif;letter-spacing:.02em;background:var(--acc2);color:var(--acc-ink);flex:none}
.pres b{display:block;font-size:14px;line-height:1.3}
.pres small{display:block;font-size:12.5px;color:var(--mute);line-height:1.35}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;font-size:13.5px;margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.sub{font-size:12.5px;color:var(--mute);margin:0 0 2px}

/* links, tables, misc */
.lk{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.lk:last-child{border-bottom:0}
.lk a{flex:1;min-width:0;word-break:break-all;overflow-wrap:anywhere}
.lk .src{color:var(--mute);font-size:12px;max-width:40%;text-align:right}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:8px 14px;box-shadow:var(--sh)}
details.grp summary{cursor:pointer;font-weight:600;padding:4px 0}
table.sch{width:100%;border-collapse:collapse;font-size:14px;overflow-wrap:normal;word-break:normal}
table.sch th,table.sch td:first-child{white-space:nowrap}
table.sch td,table.sch th{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:left}
table.sch th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;background:var(--card2);border-bottom-color:var(--line)}
table.sch tr:hover td{background:var(--card2)}
table.sch tr.done td{color:var(--mute)}
table.sch .pill{margin:0}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#101833;color:#fff;border:1px solid rgba(255,255,255,.14);padding:10px 16px;border-radius:10px;z-index:20;font-size:14px;max-width:calc(100vw - 24px);width:max-content;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pop .18s ease-out}

@media (max-width:1000px){#detail .panel{margin:12px}.topics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){

, "Slides 26-37 + Demos 2 and 3: experiment design, more attempts, ablation", "Slides 38-59: reproducibility (log and replay) and human validation; Demo 4 optional", "Slides 60-68 + Demo 5: baselines and pass@k / speedup@k", "Apply the reporting checklist to one LLM use in your own work"], "questions": ["Why is reporting a single LLM output misleading, and what do you report instead?", "3 of 10 samples are correct. What are pass@1 and pass@3?", "Why log and replay generations instead of rerunning the model?", "Give a measurable alternative to 'rate this explanation good/ok/bad'."], "extras": [{"title": "Companion study guide (plain-English summary, quiz, pass@k calculator)", "url": "llm-evaluation-study-guide.html"}, {"title": "Tutorial site (slides + demos)", "url": "https://parallelcodefoundry.github.io/tutorials/sc-2026-llm-eval/"}, {"title": "Slides (PDF, public)", "url": "https://parallelcodefoundry.github.io/assets/presentations/rigorous-llm-tutorial-sc-2026.pdf"}, {"title": "Demo 1: where randomness enters", "url": "https://parallelcodefoundry.github.io/tutorials/sc-2026-llm-eval/demos/sampling.html"}, {"title": "Demo 2: can more attempts give a better answer?", "url": "https://parallelcodefoundry.github.io/tutorials/sc-2026-llm-eval/demos/sampling-workbench.html"}, {"title": "Demo 3: ablation (LLM self-repair)", "url": "https://parallelcodefoundry.github.io/tutorials/sc-2026-llm-eval/demos/ablation-workbench.html"}, {"title": "Demo 4: replaying logged generations", "url": "https://parallelcodefoundry.github.io/tutorials/sc-2026-llm-eval/demos/http-replay-agent.html"}, {"title": "Demo 5: probabilistic metrics", "url": "https://parallelcodefoundry.github.io/tutorials/sc-2026-llm-eval/demos/probabilistic-metrics.html"}, {"title": "Replay demo code (GitHub)", "url": "https://github.com/parallelcodefoundry/llm-eval-isc-2026"}, {"title": "Can Large Language Models Write Parallel Code? (pass@k / speedup@k)", "url": "https://arxiv.org/abs/2401.12554"}], "files": [{" function plan(){
  // sequential plan: remaining hours of each tutorial at S.hpw hours per week, starting at S.start
  let day=new Date(S.start+"T12:00:00"), perDay=S.hpw/7, out=[];
  for(const t of counted()){const left=t.hours*(1-prog(t));const st=new Date(day);day=new Date(day.getTime()+Math.ceil(left/perDay)*86400000);out.push({t,st,en:new Date(day),left})}
  return out;
}
function finishDate(){const p=plan();if(!p.length)return"-";return p[p.length-1].en.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}

const T={ready:false,me:null,db:null,user:null,progress:{},leads:{},names:{}};
const docsOf=s=>Array.isArray(s)?s:(s&&(s.docs||s.items||s.rows))||[];
const dataOf=x=>x?(typeof x.data==="function"?x.data():(x.data!==undefined?x.data:x)):null;
const idOf=x=>x&&(x.id||(x.ref&&x.ref.id)||(x.path&&String(x.path).split("/").pop()));
function leadOf(id){const u=T.leads[id];return u?(T.names[u]||"a teammate"):""}
function teamDoneOn(t){if(!T.ready)return"";const ids=Object.keys(T.progress);const n=ids.filter(u=>{const s=(T.progress[u].steps||{})[t.id]||[];return s.filter(Boolean).length>=t.steps.length}).length;return ` · ${n}/${ids.length} teammates done`}
async function names(){try{const ids=[...new Set([...Object.keys(T.progress),...Object.values(T.leads)])];if(!ids.length||!T.user.profiles)return;const ps=await T.user.profiles(ids);ids.forEach(i=>{T.names[i]=(ps&&ps[i]&&ps[i].name)||T.names[i]||(i===T.me?"You":"Teammate")})}catch(e){}}
let pushT=null;
function pushProgress(){if(!T.ready)return;clearTimeout(pushT);pushT=setTimeout(async()=>{try{await T.db.doc("progress/"+T.me).set({steps:S.steps,updated:Date.now()})}catch(e){toast("Could not save team progress (you may have view-only access).")}},800)}
async function toggleLead(id){try{const r=T.db.doc("leads/"+id);if(T.leads[id]===T.me){await r.delete();delete T.leads[id]}else{await r.set({by:T.me,at:Date.now()});T.leads[id]=T.me}await names();openT(id)}catch(e){toast("Could not update the lead (you may have view-only access).")}}
async function initTeam(){
  if(!D.teamMode)return;
  const show=()=>{if(S.view==="team"&&!dOpen())render()};
  if(!window.claude||!window.claude.use){T.err="The team board works only on the shared team page.";show();return}
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){T.err="Team features unavailable here.";show();return}
    T.db=db;T.user=user;T.me=await user.id();if(!T.me){T.err="Team features unavailable here (not signed in).";show();return}
    const timer=setTimeout(()=>{if(!T.ready){T.err="Team data is taking long to load.";show()}},10000);
    try{const mine=dataOf(await db.doc("progress/"+T.me).get());
      if(mine&&mine.steps){for(const k in mine.steps){if(!S.steps[k])S.steps[k]=mine.steps[k]}save()}}catch(e){}
    const onProg=snap=>{clearTimeout(timer);T.progress={};docsOf(snap).forEach(d=>{const v=dataOf(d);const i=idOf(d);if(i&&v)T.progress[i]=v});const first=!T.ready;T.ready=true;T.err=null;if(first&&Object.values(S.steps).some(a=>(a||[]).some(Boolean)))pushProgress();names().then(()=>{if(["team","path","today"].includes(S.view)&&!dOpen())render()})};
    const onLead=snap=>{T.leads={};docsOf(snap).forEach(d=>{const v=dataOf(d);const i=idOf(d);if(i&&v&&v.by)T.leads[i]=v.by});names().then(()=>{if(["team","path"].includes(S.view)&&!dOpen())render()})};
    db.collection("progress").onSnapshot(onProg,e=>{clearTimeout(timer);T.err="Team progress unavailable.";show()});
    db.collection("leads").onSnapshot(onLead,()=>{});
  }catch(e){T.err="Team features unavailable here.";show()}
}
function team(){
  const c=(D.team&&D.team.cadence)||[];
  const how=`<div class="card"><h2>How we learn together</h2>${c.map(([a,b])=>`<div class="lk" style="align-items:flex-start"><b style="min-width:220px">${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div>`;
  const err=T.err?`<p class="small" style="color:var(--warn)">${esc(T.err)}</p>`:'';
  const priv=D.teamMode?`<p class="small mute"><b>Privacy:</b> ticking steps shares your name and progress with everyone who can open this page. Volunteering as a lead shares your name too. Your notes and self-check answers stay in this browser.</p>`:'';
  if(!T.ready){
    return `<div class="card"><h2>Team board</h2>${D.teamMode?(err||`<p class="mute small">Connecting to the team board... (it appears when this page is opened from its shared link while signed in)</p>`)+priv:`<p class="mute small">The team board lives on the shared team page. This copy tracks your own progress only.</p>`}</div>`+how+teamPlan();
  }
  const ids=Object.keys(T.progress).sort((a,b)=>a===T.me?-1:b===T.me?1:0);
  const pct=u=>{const st=(T.progress[u]||{}).steps||{};const h=D.tutorials.reduce((a,t)=>a+t.hours*Math.min(1,((st[t.id]||[]).filter(Boolean).length)/(t.steps.length||1)),0);return Math.round(100*h/D.tutorials.reduce((a,t)=>a+t.hours,0))};
  const cell=(u,t)=>{const s=((T.progress[u]||{}).steps||{})[t.id]||[];const n=s.filter(Boolean).length;return t.steps.length&&n>=t.steps.length?'<span class="pill ok">✓</span>':n?`<span class="pill">${n}/${t.steps.length}</span>`:'<span class="mute">·</span>'};
  const rows=ids.map(u=>`<tr><td><b>${esc(T.names[u]||(u===T.me?"You":"Teammate"))}</b></td><td>${pct(u)}%</td>${D.tutorials.map(t=>`<td style="text-align:center">${cell(u,t)}</td>`).join("")}</tr>`).join("");
  return `<div class="card"><h2>Team board</h2>${err}${priv}<p class="small mute">${ids.length} ${ids.length===1?"person has":"people have"} started. Progress updates live as people tick steps. Click a tutorial number to open it.</p>
   <div style="overflow:auto"><table class="sch"><tr><th>Who</th><th>Overall</th>${D.tutorials.map(t=>`<th style="text-align:center"><a href="#" onclick="openT(${t.id});return false" title="${esc(t.title)}">${t.n}</a></th>`).join("")}</tr>${rows||'<tr><td colspan="${D.tutorials.length+2}" class="mute">Nobody has started yet. Tick a step on any tutorial to appear here.</td></tr>'}</table></div></div>
   <div class="card"><h2>Leads</h2>${D.tutorials.map(t=>`<div class="lk"><a href="#" onclick="openT(${t.id});return false" style="flex:1">#${t.n} ${esc(t.title)}</a><span class="src">${T.leads[t.id]?esc(leadOf(t.id)):'<i>open — volunteer on the card</i>'}</span></div>`).join("")}</div>`+how+teamPlan();
}
function teamPlan(){
  const start=(D.team&&D.team.start)||S.start;let day=new Date(start+"T12:00:00");const f=d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  // holiday break: no sessions in the weeks of Dec 21 and Dec 28
  const hol=d=>(d.getMonth()===11&&d.getDate()>=21)||(d.getMonth()===0&&d.getDate()<=3);
  const wk=d=>{const x=new Date(d);x.setDate(x.getDate()+7);return x};
  const skip=d=>{while(hol(d))d=wk(d);return d};
  const rows=D.tutorials.filter(t=>!t.optional).map(t=>{const w=t.hours>=8?2:1;day=skip(day);const st=new Date(day);for(let k=0;k<w;k++)day=wk(skip(day));return `<tr><td>${f(st)}</td><td>#${t.n} <a href="#" onclick="openT(${t.id});return false">${esc(t.title)}</a></td><td>${esc((phaseOf(t.phase)||{}).title||"")}</td><td>${w} wk</td><td>${T.ready&&T.leads[t.id]?esc(leadOf(t.id)):'—'}</td></tr>`}).join("");
  return `<div class="card"><h2>Team calendar (one tutorial a week)</h2><p class="small mute">Starts ${f(new Date(start+"T12:00:00"))}. Phase 0 basics are self-paced and not in the calendar. Tutorials of 8 hours or more get two weeks. No sessions in the weeks of Dec 21 and Dec 28 (holiday). Ends around ${f(day)}.</p><div style="overflow:auto"><table class="sch"><tr><th>Week of</th><th>Tutorial</th><th>Phase</th><th>Length</th><th>Lead</th></tr>${rows}</table></div></div>`;
}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeT()});
{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))S.view=h;}
document.getElementById("apptitle").textContent=D.title||"SC'26 Learning Path";document.title=D.title||document.title;
if(TO){const b=document.querySelector("a.brand");b.setAttribute("href","#tutorials");b.onclick=()=>{go("tutorials");return false}}
if(!LS&&!TO){const b=document.createElement("div");b.className="wrap";b.innerHTML=`<div class="card" role="status" style="margin:12px 0 0;display:flex;gap:10px;align-items:center;border-color:var(--warn)"><span style="flex:1">Progress can't be saved in this browser; use Backup › Export.</span><button class="btn" onclick="this.closest('.wrap').remove()">Dismiss</button></div>`;document.getElementById("main").before(b)}
render();initTeam();route();
window.addEventListener("hashchange",route);
</script>
